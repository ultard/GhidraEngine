name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - ubuntu-24.04
          - macos-15

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml

      - name: Restore Conan cache
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: >-
            conan-${{ runner.os }}-${{
              hashFiles(
                'conanfile.py',
                'conan.lock',
                'third_party/**/conanfile.py',
                'third_party/**/conandata.yml'
              )
            }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install tools
        run: python -m pip install conan cmake ninja

      - name: Configure Conan
        run: |
          conan profile detect --force
          conan export third_party/pdq

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=conan_provider.cmake \
            -DCONAN_INSTALL_ARGS="--build=missing" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DGHIDRAENGINE_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-shared --parallel

      - name: Install
        run: cmake --install build-shared --prefix build-shared/package

      - name: Test
        run: ctest --test-dir build-shared --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ghidraengine-${{ runner.os }}-shared
          path: build-shared/package/
          if-no-files-found: error

      - name: Clean Conan cache
        if: always()
        run: conan cache clean "*"